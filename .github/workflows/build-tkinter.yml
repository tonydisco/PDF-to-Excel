name: Build Tkinter installers

# Build bản cài đặt cho Windows (.exe) và macOS (.app + .dmg).
# - Chạy tự động mỗi lần push, hoặc bấm tay (workflow_dispatch).
# - Tải file build ở tab "Actions" → chọn run → mục "Artifacts".
# - Nếu push 1 tag dạng v* (vd: git tag v1.0 && git push --tags) thì còn
#   tự tạo Release đính kèm cả 2 file.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------- Test
  # Cổng chất lượng: bộ cài CHỈ được build khi test xanh (windows/macos đều
  # `needs: test`). Trước đây 301 test chưa từng chạy trên CI ở bất kỳ commit
  # nào — một lỗi làm vỡ bóc tách sẽ đi thẳng vào bộ cài phát cho người dùng.
  #
  # Máy CI không có corpus BCTC lẫn Tesseract: 285/301 test vẫn chạy, 16 test
  # cần corpus/tesseract tự bỏ qua (pytest.skip) — đo tại máy trước khi thêm.
  #
  # Ma trận 3.9 = SÀN mà README cam kết. Trước đây sàn này chỉ được kiểm bằng
  # ast.parse (cú pháp), chưa bao giờ CHẠY THẬT trên 3.9.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cài thư viện (chạy + phát triển)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Chạy test
        run: python -m pytest tests/ -v --tb=short

  # ---------------------------------------------------------------- Windows
  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Gói kèm Tesseract-OCR (bản rút gọn)
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $src = "C:\Program Files\Tesseract-OCR"
          if (-not (Test-Path $src)) { $src = "C:\Program Files (x86)\Tesseract-OCR" }

          New-Item -ItemType Directory -Force -Path tesseract\tessdata | Out-Null

          # Chỉ lấy file thực thi và DLL. Copy -Recurse toàn bộ thư mục sẽ kéo
          # theo mọi gói ngôn ngữ chocolatey cài kèm và thư mục tài liệu, làm
          # phình gói cài lên hàng trăm MB.
          Copy-Item "$src\tesseract.exe" -Destination tesseract -Force
          Copy-Item "$src\*.dll" -Destination tesseract -Force

          # Chỉ ba gói ngôn ngữ thực sự dùng:
          #   vie = tiếng Việt (bản đi kèm repo), eng = dự phòng, osd = dò hướng trang
          Copy-Item "tessdata\vie.traineddata" -Destination "tesseract\tessdata\" -Force
          foreach ($lang in @("eng", "osd")) {
            $f = Join-Path $src "tessdata\$lang.traineddata"
            if (Test-Path $f) { Copy-Item $f -Destination "tesseract\tessdata\" -Force }
          }

          $mb = [math]::Round((Get-ChildItem tesseract -Recurse |
                Measure-Object -Property Length -Sum).Sum / 1MB, 1)
          Write-Host "Tesseract rút gọn: $mb MB"
          Get-ChildItem tesseract -Recurse -File | Select-Object -First 30 FullName
      - name: Đóng gói .exe
        run: python -m PyInstaller --noconfirm --clean pdf2excel.spec
      - name: Đọc số phiên bản
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path version.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Phiên bản: $v"

      - name: Dựng bộ cài (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.ver.outputs.version }}" `
            installer\BCTC_Setup.iss
          Get-ChildItem installer\Output

      - uses: actions/upload-artifact@v4
        with:
          name: BCTC_PDF_to_Excel-windows-setup
          path: installer/Output/BCTC_PDF_to_Excel-Setup.exe

      - name: Đính kèm Release (khi push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/BCTC_PDF_to_Excel-Setup.exe

  # ------------------------------------------------------------------ macOS
  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Tạo icon .icns
        run: |
          python assets/make_icon.py || true
          iconutil -c icns assets/icon.iconset -o assets/icon.icns || true
      - name: Đóng gói .app
        run: python -m PyInstaller --noconfirm --clean pdf2excel.spec
      - name: Tạo .dmg
        run: |
          mkdir -p dmg_root
          cp -R "dist/BCTC_PDF_to_Excel.app" dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "BCTC PDF to Excel" -srcfolder dmg_root \
            -ov -format UDZO "dist/BCTC_PDF_to_Excel-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: BCTC_PDF_to_Excel-macos
          path: dist/BCTC_PDF_to_Excel-macos.dmg
      - name: Đính kèm Release (khi push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BCTC_PDF_to_Excel-macos.dmg
